# pr-tests.yml — Test-Gate für Pull Requests auf die maja-Linie.
#
# Lücke bis 2026-07-27: release-fork.yml (mit dem pytest-Gate) triggert nur auf
# PUSH nach maja/main, also ERST NACH dem Merge. PRs liefen damit ungeprüft —
# die Absicherung hing daran, dass ein Mensch/Agent die Suite lokal laufen ließ.
# Dieser Workflow zieht dasselbe Gate auf den PR vor.
name: PR Tests

on:
  pull_request:
    branches:
      - maja/main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'

jobs:
  tests:
    name: Test suite
    # Guard: nur im eigenen Fork (upstream hat eigene Workflows)
    if: github.repository == 'x13ijuu/Quasarr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # stdlib unittest, per tests/AGENTS.md ("no pytest, no conftest"). CI ran
      # pytest, which collects unittest classes and so stayed green while
      # drifting from the documented contract - and from what the suite is
      # actually verified with locally.
      - name: Run tests
        run: uv run python -X utf8 -m unittest discover -s tests
