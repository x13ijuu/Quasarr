# auto-rebase.yml — hält die maja-Linie automatisch auf dem neuesten Upstream-Release.
#
# ACHTUNG: Scheduled-Workflows laufen NUR vom Default-Branch. Default-Branch des
# Forks ist deshalb maja/main (seit 2026-07-26); `main` bleibt reiner Upstream-Mirror.
#
# Täglich (06:00 UTC): neuestes rix1337/Quasarr-Release-Tag vs. __version__ auf
# maja/main. Ist Upstream neuer: Merge + MAJA_PATCH_LEVEL-Bump + volle Testsuite.
#   * Merge sauber + Tests grün  -> direkter Push auf maja/main (Release-Fork-CI
#     baut das Image ghcr.io/x13ijuu/quasarr:<ver>-maja.<n>); den RepoInfra-Bump
#     übernimmt Renovate (custom versioning), Deploy der media-stack ist dort
#     path-gefiltert automatisiert.
#   * Konflikt ODER Tests rot    -> Branch + PR (Mensch entscheidet), kein Push.
# Manuell anstoßbar via workflow_dispatch.
name: Auto Rebase Upstream
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Fallback-Kanal: darf Actions keine PRs anlegen, wird stattdessen ein Issue
  # erzeugt — damit ein gescheiterter Rebase NIE nur im Log steht.
  issues: write
  # Der Push unten kann den Image-Build nicht selbst ausloesen: GitHub feuert
  # keine on:push-Workflows fuer Pushes mit GITHUB_TOKEN (Rekursionsschutz).
  # Der Job dispatcht release-fork.yml deshalb explizit — und dafuer braucht er
  # actions:write. Ohne diese Zeile scheiterte am 2026-08-27 genau dieser
  # Schritt mit "HTTP 403: Resource not accessible by integration", NACHDEM der
  # Rebase bereits gepusht war: maja/main stand auf maja.34, ein Image dazu gab
  # es nie.
  actions: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maja/main
          fetch-depth: 0

      - name: Detect upstream release
        id: up
        run: |
          set -euo pipefail
          latest="$(curl -sf https://api.github.com/repos/rix1337/Quasarr/releases/latest | jq -r .tag_name)"   # z.B. v.4.6.4
          upver="${latest#v.}"
          cur="$(grep -oP '__version__ = "\K[^"]+' quasarr/providers/version.py)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "upver=$upver"   >> "$GITHUB_OUTPUT"
          echo "cur=$cur"       >> "$GITHUB_OUTPUT"
          if [ "$upver" = "$cur" ]; then echo "action=none" >> "$GITHUB_OUTPUT";
          else echo "action=rebase" >> "$GITHUB_OUTPUT"; fi

      - name: Merge upstream + bump patch level
        id: merge
        if: steps.up.outputs.action == 'rebase'
        run: |
          set -euo pipefail
          git config user.name "maja-auto-rebase"
          git config user.email "maja-auto-rebase@users.noreply.github.com"
          git remote add upstream https://github.com/rix1337/Quasarr.git
          git fetch upstream tag "${{ steps.up.outputs.latest }}" --no-tags
          # Upstream-Workflows gehoeren nicht in den Fork: wir haben sie geloescht,
          # upstream aendert sie trotzdem weiter. Jede solche Aenderung war ein
          # modify/delete-Konflikt, und der wip-Branch trug die upstream-Version —
          # GITHUB_TOKEN darf aber keine Workflow-Dateien pushen ("refusing to allow
          # a GitHub App to create or update workflow ... without workflows
          # permission"). Am 2026-10-16/17 scheiterte daran der Push fuer v.4.7.3,
          # NOCH VOR dem Issue — es gab weder Branch noch Signal ausser dem roten Lauf.
          # Darum: .github/workflows/ nach jedem Merge exakt auf den Fork-Stand.
          # Neue upstream-Workflows fliegen raus, geloeschte bleiben geloescht.
          # Gleicher Block im PR-Schritt unten.
          keep_fork_workflows() {
            git rm -r -q -f --ignore-unmatch -- .github/workflows
            git checkout HEAD -- .github/workflows
          }
          git merge --no-ff --no-commit "${{ steps.up.outputs.latest }}" || true
          git rev-parse -q --verify MERGE_HEAD >/dev/null \
            || { echo "::error::git merge hat keinen Merge-Zustand hinterlassen."; exit 1; }
          keep_fork_workflows
          # Konflikte nur in Workflow-Dateien sind damit aufgeloest — entscheidend
          # ist, was DANACH noch unmerged ist.
          if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            git commit -q -m "merge: upstream ${{ steps.up.outputs.latest }} into maja line (auto-rebase)"
            n="$(grep -oP 'MAJA_PATCH_LEVEL = \K[0-9]+' quasarr/providers/version.py)"
            sed -i "s/^MAJA_PATCH_LEVEL = ${n}$/MAJA_PATCH_LEVEL = $((n+1))/" quasarr/providers/version.py
            git commit -am "chore(fork): maja.$((n+1)) — auto-rebase onto ${{ steps.up.outputs.latest }}"
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.merge.outputs.state == 'merged'
        uses: astral-sh/setup-uv@v5

      - name: Test suite (gate)
        id: tests
        if: steps.merge.outputs.state == 'merged'
        continue-on-error: true
        # Derselbe Runner wie pr-tests.yml / release-fork.yml (stdlib unittest,
        # tests/AGENTS.md) — pytest sammelt mehr ein und kann gruen bleiben, wo
        # das Release-Gate danach rot wird.
        run: uv run python -X utf8 -m unittest discover -s tests

      - name: Push to maja/main (clean merge + green tests)
        if: steps.merge.outputs.state == 'merged' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO ist Pflicht: `gh` löst das Base-Repo eines Forks sonst auf das
          # PARENT auf (rix1337/Quasarr) — verstärkt durch den upstream-Remote, den
          # der Merge-Schritt oben anlegt. Ohne das lief der Dispatch am 02./03.08.2026
          # zweimal in "HTTP 404: workflow release-fork.yml not found" gegen Upstream,
          # während der Push längst durch war: maja.20/.21 existierten als Commit,
          # aber ohne Image.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push origin maja/main
          # Pushes mit GITHUB_TOKEN triggern keine on:push-Workflows — den
          # Image-Build daher explizit dispatchen (release-fork.yml hat workflow_dispatch).
          #
          # Ab hier ist der Push UNWIDERRUFLICH durch. Scheitert der Dispatch,
          # steht maja/main auf einem Patch-Level, zu dem es kein Image gibt —
          # dreimal passiert (02./03.08. HTTP 404 Fork-Aufloesung, 27.08. HTTP 403
          # fehlendes actions:write). Ein blosses `exit 1` verschwindet im Log,
          # weil ci-watch den Fork nicht sieht. Also legt der Schritt dasselbe
          # Issue an wie der PR-Fallback ("auto-rebase braucht Hand: …"), auf das
          # maja-hq/update-path-watch bereits horcht — und scheitert danach laut.
          if ! gh workflow run release-fork.yml --ref maja/main; then
            level="$(grep -oP 'MAJA_PATCH_LEVEL\s*=\s*\K\d+' quasarr/providers/version.py || echo '?')"
            title="auto-rebase braucht Hand: Image-Build fuer maja.${level} nicht ausgeloest"
            have="$(gh issue list --state open --search "$title in:title" \
                      --json number -q '.[0].number' 2>/dev/null || true)"
            if [ -z "$have" ]; then
              gh issue create --title "$title" --body \
          "Der Rebase auf upstream ${{ steps.up.outputs.latest }} ist gelungen und \`maja/main\` ist
          **gepusht** (maja.${level}) — aber der Dispatch von \`release-fork.yml\` ist gescheitert.

          **Zustand:** \`maja/main\` traegt maja.${level}, ein Image dazu existiert NICHT.
          Der Live-Container laeuft weiter auf dem vorigen Pin; es ist nichts kaputt,
          aber der Fork ist dem Deployment voraus.

          **Von Hand:**
          \`\`\`
          gh workflow run release-fork.yml --repo ${{ github.repository }} --ref maja/main
          \`\`\`
          Danach den Pin in RepoInfra (\`media-stack/docker-compose.yml\`) nachziehen.

          Dritter Vorfall dieser Klasse (02./03.08. HTTP 404, 27.08. HTTP 403)." \
                || echo "::warning::Issue konnte nicht angelegt werden."
            else
              echo "::notice::Issue #$have besteht bereits."
            fi
            echo "::error::Image-Build fuer maja.${level} nicht ausgeloest — maja/main ist gepusht, das Image fehlt."
            exit 1
          fi

      - name: Open PR instead (conflict or red tests)
        if: steps.up.outputs.action == 'rebase' && (steps.merge.outputs.state == 'conflict' || steps.tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          # Hier wiegt die Fork-Auflösung noch schwerer als beim Dispatch: ohne
          # GH_REPO würde `gh pr create` die maja-Patches als PR an rix1337/Quasarr
          # richten statt an den eigenen Fork.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          b="maja/auto-rebase-${{ steps.up.outputs.upver }}"
          git checkout -B "$b"
          if [ "${{ steps.merge.outputs.state }}" = "conflict" ]; then
            git merge "${{ steps.up.outputs.latest }}" || true
            # Wie im Merge-Schritt: sonst traegt der wip-Commit upstream-Workflows
            # und der Push unten wird abgelehnt.
            git rm -r -q -f --ignore-unmatch -- .github/workflows
            git checkout HEAD -- .github/workflows
            git add -A && git commit -m "wip: auto-rebase ${{ steps.up.outputs.latest }} (KONFLIKTE — manuell lösen)" || true
          fi
          git push -f origin "$b"

          # `|| echo "PR existiert vermutlich schon"` stand hier frueher und hat JEDEN
          # Fehler verschluckt — der Step endete mit 0, der Workflow meldete success.
          # Real gescheitert ist er seit 2026-08-10 an
          #   "GitHub Actions is not permitted to create or approve pull requests"
          # (Repo-Setting can_approve_pull_request_reviews=false). Ergebnis: upstream
          # 4.6.15 und 4.6.16 blieben 10 Tage unbemerkt liegen, taeglich gruen gemeldet.
          #
          # Jetzt: "gibt es schon" ist der EINZIGE hinnehmbare Fehler. Alles andere
          # faellt laut aus, damit der rote Lauf sichtbar wird (ci-watch sieht nur
          # conclusion=failure).
          set +e
          out="$(gh pr create --base maja/main --head "$b" \
            --title "auto-rebase: upstream ${{ steps.up.outputs.latest }} braucht Hand" \
            --body "Automatischer Rebase gescheitert: ${{ steps.merge.outputs.state == 'conflict' && 'Merge-Konflikt' || 'Tests rot' }}. Bitte manuell lösen — Muster: x13ijuu/Quasarr#1/#2." 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            case "$out" in
              *"already exists"*|*"A pull request already exists"*)
                echo "::notice::PR fuer $b existiert bereits — nichts zu tun."
                ;;
              *"not permitted to create or approve pull requests"*)
                # Repo-Setting can_approve_pull_request_reviews=false. Das Signal
                # trotzdem zustellen — ein Issue braucht nur issues:write, das der
                # Standard-Token hat. Idempotent ueber den Branch-Namen im Titel,
                # damit nicht jeder Lauf ein neues Issue anlegt.
                title="auto-rebase braucht Hand: $b"
                have="$(gh issue list --state open --search "$title in:title" \
                          --json number -q '.[0].number' 2>/dev/null || true)"
                if [ -n "$have" ]; then
                  echo "::notice::Issue #$have besteht bereits fuer $b."
                else
                  gh issue create --title "$title" --body \
                    "Der automatische Rebase auf upstream ${{ steps.up.outputs.latest }} ist gescheitert (${{ steps.merge.outputs.state == 'conflict' && 'Merge-Konflikt' || 'Tests rot' }}).

          Branch \`$b\` ist gepusht und enthaelt den Stand zum Weiterarbeiten.

          Ein PR konnte nicht erstellt werden: GitHub Actions darf in diesem Repo keine
          Pull Requests anlegen (Setting \`can_approve_pull_request_reviews\`). Entweder
          das Setting aktivieren oder den PR von Hand aus \`$b\` oeffnen." \
                    && echo "::warning::PR nicht erlaubt — stattdessen Issue angelegt fuer $b."
                fi
                ;;
              *)
                echo "::error::gh pr create fehlgeschlagen (rc=$rc). Branch $b ist gepusht, aber es gibt KEINEN PR — der Rebase braucht Hand."
                exit "$rc"
                ;;
            esac
          fi
